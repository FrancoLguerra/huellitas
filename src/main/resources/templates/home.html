<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Huellitas</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS propio -->
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>

<body>

<!-- ==============================
     NAVBAR
================================ -->

<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- ==============================
     CONTENIDO
================================ -->

<main class="contenido">

    <div class="saludo">

        <h1>¡Hola, Franco!</h1>

        <p>
            Gracias por ser parte de esta comunidad
            <i class="bi bi-paw-fill saludo-patita"></i>
        </p>

    </div>

    <div class="row g-4">

        <!-- CONTENIDO PRINCIPAL -->
        <div class="col-lg-8">

            <div class="huellitas-card">

                <h3>Bienvenido a Huellitas</h3>

                <p class="text-secondary mb-0">
                    Publicá, buscá y ayudá a que las mascotas
                    vuelvan con sus familias.
                </p>

            </div>

        </div>

        <!-- PANEL DERECHO -->
        <div class="col-lg-4">

            <div class="huellitas-card">

                <h3>Buscar mascota</h3>

                <div class="input-group mt-3">

                    <span class="input-group-text bg-white">
                        <i class="bi bi-search"></i>
                    </span>

                    <input type="text"
                           class="form-control"
                           placeholder="Nombre, especie o característica...">

                </div>

                <button class="btn btn-success w-100 mt-3 btn-huellitas">

                    <i class="bi bi-search me-2"></i>
                    Buscar

                </button>

            </div>

        </div>

    </div>

</main>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
</script>

</body>
</html>
