<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:if="${id == null}">Nueva publicación - Huellitas</title>
    <title th:if="${id != null}">Editar publicación - Huellitas</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Navbar -->
    <link rel="stylesheet"
          th:href="@{/css/navbar.css}">

    <!-- CSS de esta vista -->
    <link rel="stylesheet"
          th:href="@{/css/publicacion-form.css}">

</head>

<body>

    <!-- NAVBAR -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>


    <main class="form-page">

        <div class="form-container">

            <!-- ENCABEZADO -->
            <div class="form-header">

                <div class="header-icon">
                    <i class="bi bi-file-earmark-plus"></i>
                </div>

                <div>
                    <h1 th:if="${id == null}">
                        Nueva publicación
                    </h1>

                    <h1 th:if="${id != null}">
                        Editar publicación
                    </h1>

                    <p>
                        Completá los datos para publicar información
                        sobre una mascota.
                    </p>
                </div>

            </div>


            <!-- FORMULARIO -->
            <form th:action="@{/publicaciones}"
      th:object="${form}"
      method="post"
      class="publication-form">

    <div class="form-section">

        <div class="section-title">
            <i class="bi bi-heart"></i>
            <span>Datos de la mascota</span>
        </div>

        <div class="form-group">

            <label for="nombreMascota">
                Nombre
            </label>

            <input
                type="text"
                id="nombreMascota"
                th:field="*{nombreMascota}"
                class="form-control"
                placeholder="Ej. Luna"
                required>

        </div>


        <div class="form-group">

            <label for="especie">
                Especie
            </label>

            <select
                id="especie"
                th:field="*{especie}"
                class="form-control"
                required>

                <option value="">
                    Seleccioná una especie
                </option>

                <option
                    th:each="especie : ${especies}"
                    th:value="${especie}"
                    th:text="${especie}">
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="genero">
                Género
            </label>

            <select
                id="genero"
                th:field="*{genero}"
                class="form-control">

                <option value="">
                    Seleccioná un género
                </option>

                <option
                    th:each="genero : ${generos}"
                    th:value="${genero}"
                    th:text="${genero}">
                </option>

            </select>

        </div>


        <div class="form-group">

            <label for="color">
                Color
            </label>

            <input
                type="text"
                id="color"
                th:field="*{color}"
                class="form-control"
                placeholder="Ej. Negro y blanco"
                required>

        </div>


        <div class="form-group">

            <label for="raza">
                Raza
            </label>

            <input
                type="text"
                id="raza"
                th:field="*{raza}"
                class="form-control"
                placeholder="Ej. Labrador">

        </div>


        <div class="form-check">

            <input
                type="checkbox"
                id="castrado"
                th:field="*{castrado}"
                class="form-check-input">

            <label
                for="castrado"
                class="form-check-label">

                Castrado/a

            </label>

        </div>

    </div>


    <div class="form-section">

        <div class="section-title">
            <i class="bi bi-geo-alt"></i>
            <span>Ubicación</span>
        </div>

        <div class="form-group">

            <label for="ubicacion">
                ¿Dónde fue vista o perdida?
            </label>

            <input
                type="text"
                id="ubicacion"
                th:field="*{ubicacion}"
                class="form-control"
                placeholder="Ej. Barrio Centro"
                required>

        </div>

    </div>


    <div class="form-section">

        <div class="section-title">
            <i class="bi bi-chat-left-text"></i>
            <span>Información adicional</span>
        </div>

        <div class="form-group">

            <label for="textoAdicional">
                Descripción
            </label>

            <textarea
                id="textoAdicional"
                th:field="*{textoAdicional}"
                class="form-control textarea"
                placeholder="Contanos cualquier información que pueda ayudar..."
                maxlength="255"
                rows="5">
            </textarea>

        </div>

    </div>


    <div class="form-actions">

        <a th:href="@{/publicaciones}"
           class="btn-cancel">

            <i class="bi bi-arrow-left"></i>
            Cancelar

        </a>

        <button
            type="submit"
            class="btn-submit">

            <i class="bi bi-check-lg"></i>
            Publicar

        </button>

    </div>

</form>

        </div>

    </main>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
